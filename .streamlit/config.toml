# Theme tokens match src/viz_theme.py, so the app and the printed figures in
# the thesis read as one piece of work.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
# CORS and XSRF protection are both left at their defaults (on). Turning CORS
# off while XSRF stays on makes Streamlit warn and can break the websocket
# behind a host's proxy - which is exactly where this app runs.
maxUploadSize = 10

[browser]
gatherUsageStats = false
